<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="RoutX — панель управления VPN и прокси на роутерах OpenWrt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc9a"/>
      <stop offset="0.55" stop-color="#55c8f5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc9a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#55c8f5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -2px; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <ellipse cx="1030" cy="40" rx="380" ry="240" fill="url(#glow)"/>
  <ellipse cx="180" cy="430" rx="360" ry="190" fill="#8b5cf6" opacity="0.08"/>

  <!-- Left: brand -->
  <g transform="translate(72 64)">
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#accent)"/>
    <path d="M15 37V15h11.5c6.8 0 11 3.4 11 9.2 0 4.3-2.3 7.1-6.2 8.4L39 37h-7.4l-6.2-7.8h-3.8V37Zm6.6-13.5h4.6c2.8 0 4.4-1.3 4.4-3.7 0-2.4-1.6-3.7-4.4-3.7h-4.6Z" fill="#061018"/>
    <rect x="70" y="6" width="248" height="30" rx="15" fill="#3ddc9a" opacity="0.1" stroke="#3ddc9a" stroke-opacity="0.35"/>
    <text x="84" y="26" fill="#3ddc9a" font-size="12.5" font-weight="700" letter-spacing="1.4" class="sans">OPENWRT VPN CONTROL PLANE</text>
  </g>

  <text x="72" y="190" fill="#e7eef9" font-size="86" class="title">RoutX</text>
  <text x="74" y="232" fill="url(#accent)" font-size="27" font-weight="700" class="sans">VPN и прокси на роутерах OpenWrt</text>
  <text x="74" y="269" fill="#94a6c0" font-size="16" class="sans">Tachyon · Forkop · Prokop · Podkop — установка, подписки, правила, мониторинг и PWA.</text>
  <text x="74" y="294" fill="#64748b" font-size="15.5" class="sans">Один роутер — один продукт. Смена продукта с переносом настроек и откатом.</text>

  <!-- Feature chips -->
  <g transform="translate(74 326)" class="sans" font-size="12.5">
    <rect width="128" height="30" rx="15" fill="#3ddc9a" opacity="0.1" stroke="#3ddc9a" stroke-opacity="0.3"/>
    <text x="18" y="20" fill="#3ddc9a">Docker / native</text>
    <rect x="140" width="92" height="30" rx="15" fill="#55c8f5" opacity="0.1" stroke="#55c8f5" stroke-opacity="0.3"/>
    <text x="158" y="20" fill="#55c8f5">PWA</text>
    <rect x="244" width="150" height="30" rx="15" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="262" y="20" fill="#c4b5fd">CLI + SSH installer</text>
    <rect x="406" width="148" height="30" rx="15" fill="#f0c36b" opacity="0.1" stroke="#f0c36b" stroke-opacity="0.3"/>
    <text x="424" y="20" fill="#f0c36b">Подписки и правила</text>
  </g>

  <!-- Right: dashboard mock -->
  <g transform="translate(760 52)">
    <rect x="0" y="0" width="448" height="300" rx="20" fill="url(#card)" stroke="#263449"/>
    <rect x="1" y="1" width="446" height="44" rx="19" fill="#0b1220" stroke="#263449"/>
    <circle cx="26" cy="23" r="4" fill="#ff7185"/>
    <circle cx="42" cy="23" r="4" fill="#f0c36b"/>
    <circle cx="58" cy="23" r="4" fill="#3ddc9a"/>
    <text x="82" y="28" fill="#94a6c0" font-size="12" class="mono">routx / dashboard</text>
    <rect x="352" y="13" width="76" height="20" rx="10" fill="#3ddc9a" opacity="0.12"/>
    <text x="365" y="27" fill="#3ddc9a" font-size="10.5" font-weight="700" class="sans">ONLINE</text>

    <text x="24" y="78" fill="#e7eef9" font-size="17" font-weight="700" class="sans">Роутеры</text>
    <text x="24" y="98" fill="#64748b" font-size="11.5" class="sans">3 из 3 в сети · Tachyon 1.7.15</text>

    <!-- rows -->
    <g class="sans">
      <rect x="18" y="114" width="412" height="46" rx="12" fill="#101a2c" stroke="#1f2d44"/>
      <circle cx="38" cy="137" r="4.5" fill="#3ddc9a"/>
      <text x="54" y="134" fill="#e7eef9" font-size="12.5" font-weight="600">Квартира</text>
      <text x="54" y="149" fill="#64748b" font-size="10.5">Tachyon · 12/12 узлов</text>
      <text x="356" y="141" fill="#3ddc9a" font-size="11.5" font-weight="700">healthy</text>

      <rect x="18" y="168" width="412" height="46" rx="12" fill="#101a2c" stroke="#1f2d44"/>
      <circle cx="38" cy="191" r="4.5" fill="#3ddc9a"/>
      <text x="54" y="188" fill="#e7eef9" font-size="12.5" font-weight="600">Офис</text>
      <text x="54" y="203" fill="#64748b" font-size="10.5">Tachyon · 8/8 узлов</text>
      <text x="356" y="195" fill="#3ddc9a" font-size="11.5" font-weight="700">healthy</text>

      <rect x="18" y="222" width="412" height="46" rx="12" fill="#101a2c" stroke="#1f2d44"/>
      <circle cx="38" cy="245" r="4.5" fill="#f0c36b"/>
      <text x="54" y="242" fill="#e7eef9" font-size="12.5" font-weight="600">Дом</text>
      <text x="54" y="257" fill="#64748b" font-size="10.5">Tachyon · 22/24 узлов</text>
      <text x="356" y="249" fill="#f0c36b" font-size="11.5" font-weight="700">degraded</text>
    </g>

    <!-- mini chart -->
    <path d="M24 300 C 80 280, 120 292, 168 276 S 250 288, 300 270 S 380 282, 424 264" fill="none" stroke="#55c8f5" stroke-width="2" opacity="0.9"/>
    <path d="M24 300 C 80 280, 120 292, 168 276 S 250 288, 300 270 S 380 282, 424 264 L 424 300 L 24 300 Z" fill="#55c8f5" opacity="0.06"/>
  </g>

  <!-- Floating badges -->
  <g transform="translate(660 280)" class="sans">
    <rect width="190" height="70" rx="16" fill="#0f1a2c" stroke="#263449"/>
    <text x="16" y="26" fill="#64748b" font-size="10.5" letter-spacing="0.8">PROXY HEALTH</text>
    <text x="16" y="51" fill="#3ddc9a" font-size="21" font-weight="800">12 / 12</text>
    <text x="118" y="50" fill="#64748b" font-size="10.5">live nodes</text>
  </g>

  <text x="74" y="398" fill="#475569" font-size="11.5" class="mono">OpenWrt 24.10 / 25.12 · Node.js 22+ · PostgreSQL 16 · schema 29</text>
</svg>
