<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Архитектура RoutX">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="aaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc9a"/>
      <stop offset="1" stop-color="#55c8f5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .box { fill: #101a2c; stroke: #263449; }
      .box2 { fill: #0b1220; stroke: #263449; }
    </style>
  </defs>
  <rect width="1280" height="520" rx="22" fill="url(#abg)"/>
  <text x="64" y="58" fill="#e7eef9" font-size="26" font-weight="800" class="sans">Как устроен RoutX</text>
  <text x="64" y="84" fill="#64748b" font-size="13.5" class="sans">Панель, агент и роутер общаются через исходящий long-poll. Входящие порты на роутере не нужны.</text>

  <!-- Client / panel -->
  <g class="sans">
    <rect x="64" y="120" width="250" height="92" rx="16" class="box"/>
    <text x="84" y="152" fill="#e7eef9" font-size="15" font-weight="700">Браузер / PWA</text>
    <text x="84" y="174" fill="#94a6c0" font-size="11.5">React + Vite, service worker</text>
    <text x="84" y="192" fill="#64748b" font-size="11">HTTPS, CSRF, Web Push</text>

    <rect x="390" y="120" width="230" height="92" rx="16" class="box"/>
    <text x="410" y="152" fill="#e7eef9" font-size="15" font-weight="700">Caddy / reverse proxy</text>
    <text x="410" y="174" fill="#94a6c0" font-size="11.5">TLS, HTTP/2, Let's Encrypt</text>
    <text x="410" y="192" fill="#64748b" font-size="11">опционально в Docker</text>

    <rect x="696" y="120" width="260" height="92" rx="16" fill="#101a2c" stroke="#3ddc9a" stroke-opacity="0.45"/>
    <text x="716" y="152" fill="#e7eef9" font-size="15" font-weight="700">RoutX Panel</text>
    <text x="716" y="174" fill="#94a6c0" font-size="11.5">Fastify + TypeScript</text>
    <text x="716" y="192" fill="#64748b" font-size="11">API, задания, аудит, PWA</text>

    <rect x="1032" y="106" width="184" height="120" rx="16" class="box"/>
    <ellipse cx="1080" cy="132" rx="30" ry="9" fill="#55c8f5" opacity="0.18" stroke="#55c8f5" stroke-opacity="0.45"/>
    <path d="M1050 132v46c0 5 13 9 30 9s30-4 30-9v-46" fill="none" stroke="#55c8f5" stroke-opacity="0.45"/>
    <text x="1120" y="152" fill="#e7eef9" font-size="13" font-weight="700">PostgreSQL 16</text>
    <text x="1120" y="172" fill="#94a6c0" font-size="10.5">состояние, история</text>
    <text x="1120" y="188" fill="#64748b" font-size="10.5">миграции, аудит</text>

    <line x1="314" y1="166" x2="382" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="620" y1="166" x2="688" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="956" y1="166" x2="1024" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="322" y="158" fill="#64748b" font-size="10" class="mono">HTTPS</text>
    <text x="628" y="158" fill="#64748b" font-size="10" class="mono">proxy</text>
    <text x="964" y="158" fill="#64748b" font-size="10" class="mono">SQL</text>
  </g>

  <!-- Agent / router -->
  <g class="sans">
    <rect x="696" y="274" width="260" height="96" rx="16" fill="#101a2c" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <text x="716" y="306" fill="#e7eef9" font-size="15" font-weight="700">RoutX Agent</text>
    <text x="716" y="328" fill="#94a6c0" font-size="11.5">ucode, исходящий long-poll</text>
    <text x="716" y="346" fill="#64748b" font-size="11">без входящих портов и открытого API</text>

    <rect x="390" y="274" width="230" height="96" rx="16" class="box"/>
    <text x="410" y="306" fill="#e7eef9" font-size="15" font-weight="700">OpenWrt router</text>
    <text x="410" y="328" fill="#94a6c0" font-size="11.5">24.10 (opkg) / 25.12 (apk)</text>
    <text x="410" y="346" fill="#64748b" font-size="11">aarch64 · LuCI · ucode</text>

    <rect x="64" y="274" width="250" height="96" rx="16" class="box"/>
    <text x="84" y="306" fill="#e7eef9" font-size="15" font-weight="700">Tachyon / sing-box</text>
    <text x="84" y="328" fill="#94a6c0" font-size="11.5">Forkop · Prokop · Podkop</text>
    <text x="84" y="346" fill="#64748b" font-size="11">правила, подписки, proxy</text>

    <line x1="826" y1="212" x2="826" y2="266" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="838" y="244" fill="#8b5cf6" font-size="10" class="mono">poll / commands</text>
    <line x1="688" y1="322" x2="628" y2="322" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="382" y1="322" x2="322" y2="322" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="636" y="314" fill="#64748b" font-size="10" class="mono">uci</text>
    <text x="330" y="314" fill="#64748b" font-size="10" class="mono">reload</text>
  </g>

  <!-- CLI -->
  <g class="sans">
    <rect x="64" y="414" width="250" height="64" rx="14" fill="#0b1220" stroke="#3ddc9a" stroke-opacity="0.35"/>
    <text x="84" y="442" fill="#3ddc9a" font-size="14" font-weight="700" class="mono">routx CLI</text>
    <text x="84" y="462" fill="#94a6c0" font-size="11">install · update · status · doctor</text>

    <rect x="390" y="414" width="230" height="64" rx="14" class="box2"/>
    <text x="410" y="442" fill="#e7eef9" font-size="13" font-weight="700">Docker Compose</text>
    <text x="410" y="462" fill="#94a6c0" font-size="11">app + PostgreSQL + Caddy</text>

    <rect x="696" y="414" width="260" height="64" rx="14" class="box2"/>
    <text x="716" y="442" fill="#e7eef9" font-size="13" font-weight="700">systemd + Node.js</text>
    <text x="716" y="462" fill="#94a6c0" font-size="11">нативный режим без Docker</text>
  </g>
</svg>
