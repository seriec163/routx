stages:
  - verify
  - package

default:
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  NODE_ENV: test
  LOG_LEVEL: warn
  POSTGRES_DB: router_control
  POSTGRES_USER: router_control
  POSTGRES_PASSWORD: router_control_ci
  DATABASE_URL: postgres://router_control:router_control_ci@postgres:5432/router_control
  RC_MASTER_KEY: ci-master-key-0123456789abcdef0123456789abcdef

verify:
  stage: verify
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: router_control
        POSTGRES_USER: router_control
        POSTGRES_PASSWORD: router_control_ci
  script:
    - npm run typecheck
    - npm test
    - npm run build
    - npm run db:migrate
    - npm run db:migrate
    - npm run agent:build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - server/dist/
      - web/dist/
      - agent/dist/

docker:
  stage: package
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
  script:
    - docker build --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
